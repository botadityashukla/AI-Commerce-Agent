version: '3.8'

services:
  backend:
    build: .
    container_name: support-ai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Mount backend for hot reloading (optional)
      # - ./backend:/app/backend 
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped


